# This file was created automatically with `myst init --gh-pages` 🪄 💚
# Then edited to: build the MyST project in book/, install the gkr package
# and graphviz so code cells execute and circuit images render, install a
# Jupyter kernel so --execute has something to run against, and execute cells
# at build time.
# Ensure your GitHub Pages settings for this repository are set to deploy with **GitHub Actions**.

name: MyST GitHub Pages Deploy
on:
  push:
    # Runs on pushes targeting the default branch
    branches: [main]
env:
  # `BASE_URL` determines, relative to the root of the domain, the URL that your site is served from.
  # E.g., if your site lives at `https://mydomain.org/myproject`, set `BASE_URL=/myproject`.
  # If, instead, your site lives at the root of the domain, at `https://mydomain.org`, set `BASE_URL=''`.
  BASE_URL: /${{ github.event.repository.name }}

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write
# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: 'pages'
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v3
      - uses: actions/setup-node@v4
        with:
          node-version: 18.x
      # --- Python + the gkr package, so {code-cell} blocks can import gkr ---
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install graphviz (for circuit SVGs)
        run: sudo apt-get update && sudo apt-get install -y graphviz
      - name: Install the gkr package and Jupyter kernel
        # jupyter-server + ipykernel give MyST a kernel to execute {code-cell}
        # blocks against; without them, --execute has nothing to run and cells
        # render with no output.
        run: |
          pip install -e .
          pip install jupyter-server ipykernel
      - name: Install MyST
        run: npm install -g mystmd
      # --- Build the book (which lives in book/) WITH execution ---
      - name: Build HTML Assets
        working-directory: book
        run: myst build --html --execute
        env:
          GKR_COLOR: never
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './book/_build/html'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4