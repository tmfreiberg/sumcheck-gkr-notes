# Builds the MyST book in book/ with every code cell executed, and publishes
# it to GitHub Pages, on every push to main.
#
# Everything comes from uv.lock: the gkr package the cells import, mystmd,
# and the Jupyter kernel that --execute needs (jupyter-server, ipykernel; the
# dev extra). Without a kernel the build still succeeds but every cell
# renders empty. The PyPI mystmd package is a wrapper that needs Node.
#
# GitHub Pages must be set to deploy from GitHub Actions (Settings, Pages).

name: MyST GitHub Pages Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  # The site is served from https://<owner>.github.io/<repo>, not the root.
  BASE_URL: /${{ github.event.repository.name }}

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a queued run waits rather than cancelling the
# one in progress.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      # Circuit diagrams in the book are rendered by Graphviz.
      - name: Install Graphviz
        run: sudo apt-get update && sudo apt-get install -y graphviz

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install from the lock
        run: uv sync --locked --extra dev

      - name: Build HTML with executed cells
        working-directory: book
        run: uv run myst build --html --execute
        env:
          GKR_COLOR: never

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./book/_build/html

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
